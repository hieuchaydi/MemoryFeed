name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-quality:
    name: Python Compile + Unit Tests
    runs-on: ubuntu-latest
    env:
      OFFLINE_ONLY: "1"
      MEMORYFEED_AI_PROVIDER: "none"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi

      - name: Compile Check
        run: |
          python -m compileall backend tests
          if [ -d memoryfeed ]; then python -m compileall memoryfeed; fi

      - name: Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Selector Fixture Replay
        run: python tools/replay_selectors.py

      - name: Research Benchmark Smoke
        run: |
          python cli.py benchmark-suite --limit 5 --iterations 1
          python -c "from pathlib import Path; p=Path('backend/benchmarks/runs'); assert p.exists() and any(p.glob('research-eval-*.json'))"

  extension-syntax:
    name: Extension JS Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Extension JS
        run: |
          for file in \
            extension/chrome/content.js \
            extension/chrome/background.js \
            extension/firefox/content.js \
            extension/firefox/background.js
          do
            if [ -f "$file" ]; then
              node --check "$file"
            else
              echo "Skip missing $file"
            fi
          done
