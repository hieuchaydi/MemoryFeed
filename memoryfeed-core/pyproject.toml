[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryfeed-core"
version = "0.1.0"
description = "Core library for MemoryFeed capture, storage, indexing, and retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "lancedb>=0.6.0",
    "sentence-transformers>=2.5.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "mcp[cli]>=1.7.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/memoryfeed_core"]
