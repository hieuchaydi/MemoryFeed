<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemoryFeed</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; width: 360px; }
    .wrap { padding: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .muted { color: #64748b; font-size: 12px; margin-top: 8px; }
    .item { display: block; text-decoration: none; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; margin-top: 8px; }
    .item:hover { border-color: #3b82f6; }
    .meta { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .text { font-size: 13px; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="wrap">
    <input id="q" type="text" placeholder="Tìm: meme mèo giận..." autocomplete="off" />
    <div class="muted" id="status">Nhập từ khóa để tìm trong MemoryFeed local.</div>
    <div id="results"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
