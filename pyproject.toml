[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryfeed"
version = "0.1.0"
description = "Find anything you've seen on social media"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "lancedb>=0.6.0",
    "sentence-transformers>=2.5.0",
    "ollama>=0.1.8",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "pybind11>=2.12.0",
    "mcp[cli]>=1.7.0",
]

[project.scripts]
memoryfeed = "memoryfeed.cli:cli"

[tool.hatch.build.targets.wheel]
include = [
  "backend/**",
  "memoryfeed/**",
  "native/**",
  "extension/**",
  "frontend/**",
  "cli.py",
  "setup.sh",
  "deploy_web.sh",
  "deploy_web.ps1",
  "README.md"
]
